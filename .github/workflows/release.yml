name: Release private packages
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://npm.pkg.github.com }
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with: { publish: npm run changeset publish }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}, NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
